aid: moneris
url: https://raw.githubusercontent.com/api-evangelist/moneris/refs/heads/main/apis.yml
name: Moneris
kind: company
description: >-
  Moneris (Moneris Solutions Corporation) is Canada's largest payment processor
  and merchant-acquiring company, founded in December 2000 as a joint venture
  equally owned by Royal Bank of Canada (RBC) and Bank of Montreal (BMO). It is
  a payment-technology and card-acquiring company rather than a deposit-taking
  Schedule I bank, sitting in the payments-infrastructure layer of Canadian
  financial services: it serves roughly 325,000 points of commerce, processes
  close to five billion transactions a year, and handles on the order of one in
  three Canadian card transactions. In 2025-2026 RBC and BMO explored a sale of
  the venture, with Francisco Partners (owner of Verifone) reported as the lead
  buyer. Unlike its bank owners, Moneris is not subject to Canada's coming
  Consumer-Driven Banking framework; its "open" surface is a commercial,
  self-serve first-party developer program. Moneris runs a real, public
  developer portal at developer.moneris.com documenting the Moneris Unified API
  (REST, OpenAPI 3.0.3, hosts api.moneris.io production / api.sb.moneris.io
  sandbox) covering payments, tokenized payment methods, refunds, recurring
  billing/subscriptions, 3-D Secure, Kount fraud/risk, disputes, multi-currency
  pricing, and third-party merchant onboarding, secured with OAuth 2.0 client
  credentials and API keys, with a published Postman workspace.
deliveryModel:
  model: saas
  open_source: false
  commercial: true
  callable_host: true
