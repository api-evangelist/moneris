notes: >-
  Moneris hosts an official streamable-HTTP MCP server (in preview) that exposes
  a subset of the Moneris Unified API as agent tools. Authentication is via the
  X-API-Key and X-Merchant-Id request headers (the same credentials used for the
  REST API key auth) - there is no anonymous OAuth discovery surface; an
  anonymous tools/list returns 401 "Unauthorized: Missing Authorization header or
  X-API-Key header", so the input schemas below require authenticated
  introspection. Tool names and descriptions are captured verbatim from the
  published docs. Feedback contact: monerismcp@moneris.com.
server:
  name: moneris
  transport: http
  streamable: true
  url: https://mcp.moneris.io/
  sandbox_url: https://mcp.sb.moneris.io/
  auth:
    type: apiKey
    headers:
      - X-API-Key
      - X-Merchant-Id
  spec_reference: https://modelcontextprotocol.io/specification/2025-11-25
  preview: true
error_format: json-rpc
