notes: >-
  Binds each published Moneris MCP tool to its backing OpenAPI operationId. The
  MCP surface is a deliberate read-heavy subset of the 54-operation REST API: it
  exposes payment create/complete/cancel plus retrieve/list across the core
  resources, but omits most write operations (refund creation, subscription
  lifecycle mutations, 3-D Secure, Kount, disputes, merchant onboarding). Each
  bound tool inherits its real input contract from the referenced operation's
  parameters + requestBody in the spec. The live MCP tools/list is auth-gated
  (X-API-Key), so bindings are by documented name/semantics; confidence is high
  where the tool name maps 1:1 to a single operationId.
