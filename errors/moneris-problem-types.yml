notes: >-
  Derived from the 4xx/5xx responses of the Moneris Unified API (v2.6.1). Every
  error response uses a Problem JSON body per RFC 7807 with the envelope
  {type, title, status, detail, instance, category, errors[]}. The `errors[]`
  array carries parameter-level detail (parameterName, parameterValue,
  reasonCode, errorMessage) on validation failures. `title` is an upper-snake
  machine token (e.g. FORBIDDEN_REQUEST) and `category` groups the error class
  (e.g. UNAUTHORIZED_ERROR, VALIDATION_ERROR).
envelope:
