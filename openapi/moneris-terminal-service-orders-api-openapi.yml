components:
  schemas:
    monerisGoPortalFeeDetails:
      type:
      - object
      - 'null'
      description: A list of fees associated with Moneris Go Portal.
      properties:
        setupFee:
          description: A one-time fee charged for the initial configuration and onboarding of the product.
          type:
          - object
          - 'null'
          properties:
            feeType:
              $ref: '#/components/schemas/feeType'
            unitPrice:
              $ref: '#/components/schemas/money'
            taxes:
              type: array
              description: A list of tax items associated with the fee.
              items:
                $ref: '#/components/schemas/tax'
              maxItems: 10
            frequency:
              description: The frequency at which the fee is charged, such as monthly or annually.
              type:
              - string
              - 'null'
              maxLength: 20
              enum:
              - DAILY
              - MONTHLY
              - QUARTERLY
              - ONE_OFF
              - ANNUALLY
            quantity:
              type: integer
              description: Represent the number of times a fee is applied based on its frequency.
              format: int32
              minimum: 1
              maximum: 30
              example: 3
            isApproved:
              $ref: '#/components/schemas/isApproved'
            waivePeriod:
              $ref: '#/components/schemas/waivePeriod'
          required:
          - unitPrice
        accessFee:
          description: A fee charged for gaining access to the service.
          type:
          - object
          - 'null'
          properties:
            feeType:
              $ref: '#/components/schemas/feeType'
            unitPrice:
              $ref: '#/components/schemas/money'
            taxes:
              type: array
              description: A list of tax items associated with the fee.
              items:
                $ref: '#/components/schemas/tax'
              maxItems: 10
            frequency:
              description: The frequency at which the fee is charged, such as monthly or annually.
              type:
              - string
              - 'null'
              maxLength: 20
              enum:
              - DAILY
              - MONTHLY
              - QUARTERLY
              - ONE_OFF
              - ANNUALLY
            quantity:
              type: integer
              description: Represent the number of times a fee is applied based on its frequency.
              format: int32
              minimum: 1
              maximum: 30
              example: 3
            isApproved:
              $ref: '#/components/schemas/isApproved'
            waivePeriod:
              $ref: '#/components/schemas/waivePeriod'
          required:
          - unitPrice
    isExpeditedOrder:
      type: boolean
      description: A boolean flag indicating whether an order is being processed as a rush or expedited order.
    depositType:
      type:
      - string
      - 'null'
      description: Indicates the type of deposit arrangement for the merchant account.
      maxLength: 10
    companyName:
      type:
      - string
      - 'null'
      description: Identifies the associated company name
      minLength: 1
      maxLength: 50
      example: SP Ltd
    otherFinancialInstitutionCards:
      type: array
      description: A list of other financial institution cards.
      items:
        $ref: '#/components/schemas/ofiCardPlan'
      maxItems: 20
    monerisGatewayFeeDetails:
      type:
      - object
      - 'null'
      description: A list of fees associated to Moneris Gateway.
      properties:
        baseFee:
          description: The standard fee charged for a product.
          type:
          - object
          - 'null'
          properties:
            feeType:
              $ref: '#/components/schemas/feeType'
            unitPrice:
              $ref: '#/components/schemas/money'
            taxes:
              type: array
              description: A list of tax items associated with the fee.
              items:
                $ref: '#/components/schemas/tax'
              maxItems: 10
            frequency:
              description: The frequency at which the fee is charged, such as monthly or annually.
              type:
              - string
              - 'null'
              maxLength: 20
              enum:
              - DAILY
              - MONTHLY
              - QUARTERLY
              - ONE_OFF
              - ANNUALLY
            quantity:
              type: integer
              description: Represent the number of times a fee is applied based on its frequency.
              format: int32
              minimum: 1
              maximum: 30
              example: 3
            isApproved:
              $ref: '#/components/schemas/isApproved'
            waivePeriod:
              $ref: '#/components/schemas/waivePeriod'
          required:
          - unitPrice
        recurringFee:
          description: A fee that is charged on a regular basis.
          type:
          - object
          - 'null'
