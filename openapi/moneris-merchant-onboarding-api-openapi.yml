                    creditReportAllowed: true
                    firstName: DOMEMIC
                    lastName: TESTPOTKIDIS
                    address:
                      postalCode: K1M1N8
                      city: OTTAWA
                      province: 'ON'
                      streetName: STANLEY
                      country: CA
                    ownershipPercentage: 100
                    title: VICE_PRESIDENT
                riskDetails:
                  merchantRiskRate: A_PLUS
                pointOfSaleOptions:
                  settlementOption: MERCHANT_CLOSE
                  settlementTime: '23:00:00'
                  debitPerTransactionRefundLimit:
                    amount: 0
                    currency: CAD
                  dailyRefundLimit:
                    amount: 0
                    currency: CAD
                  dailyCancellationLimit:
                    amount: 0
                    currency: CAD
                bankingDetails:
                  creditDepositAccount:
                    currency: CAD
                    institutionNumber: 00809
                    transitNumber: '00160'
                    accountNumber: '3333333333'
                  additionalBankingAccounts: []
                chainId: '0030600062664'
                createdAt: '2025-01-01T00:00:00Z'
                modifiedAt: '2025-01-01T00:00:00Z'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServer'
        '503':
          $ref: '#/components/responses/serviceUnavailable'
    put:
      summary: Update Merchant
      operationId: updateMerchant
      security:
      - OAuth2:
        - onboarding.merchant.write
      - ApiKeyAuth: []
      tags:
      - Merchant Onboarding
      description: 'Update merchant based on the supplied payload.

        '
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/merchantPayload'
      responses:
        '204':
          description: Successful response
          headers:
            Api-Version:
              $ref: '#/components/headers/apiVersion'
            X-Correlation-Id:
              $ref: '#/components/headers/correlationId'
            Sunset:
              $ref: '#/components/headers/sunset'
            X-RateLimit-Limit:
              $ref: '#/components/headers/rateLimitCount'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/rateLimitRemaining'
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/unauthorized'
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/notFound'
        '409':
          $ref: '#/components/responses/conflict'
        '422':
          $ref: '#/components/responses/unprocessableContent'
        '429':
          $ref: '#/components/responses/tooManyRequests'
        '500':
          $ref: '#/components/responses/internalServer'
        '503':
          $ref: '#/components/responses/serviceUnavailable'
