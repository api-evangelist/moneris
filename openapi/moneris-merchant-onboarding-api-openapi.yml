              $ref: '#/components/schemas/dropShipping'
        securityDetails:
          type:
          - object
          - 'null'
          description: An object containing all details about the security details.
          required:
          - legalEntity
          - signingOfficers
          properties:
            legalEntity:
              $ref: '#/components/schemas/legalEntity'
            signingOfficers:
              type: array
              description: A list of signing officer entities.
              maxItems: 100
              items:
                $ref: '#/components/schemas/signingOfficer'
        riskDetails:
          type:
          - object
          - 'null'
          description: An object containing information related to the risk assessment of a transaction or account.
