      - merchantId
    address:
      type: object
      description: 'The postal address including street, town/city, province, and postal code.

        Optionally an unit number can be provided.

        '
      properties:
        unitNumber:
          type:
          - string
          - 'null'
          description: Unit number
          minLength: 1
          maxLength: 19
          example: 123A
        streetNumber:
          type:
          - string
          - 'null'
          description: Street number
          minLength: 1
          maxLength: 19
          example: '3300'
        streetName:
          type:
          - string
          - 'null'
          description: Street name
          minLength: 1
          maxLength: 100
          example: Bloor
        city:
          type:
          - string
          - 'null'
          description: 'Identifies the city.

            '
          minLength: 1
          maxLength: 50
          example: Toronto
        province:
          type:
          - string
          - 'null'
          description: 'Province or state ISO 3166-2 code '
          minLength: 1
          maxLength: 3
          format: iso-3166-2
          example: 'ON'
        postalCode:
          type:
          - string
          - 'null'
          description: Postal or zip code
          minLength: 1
          maxLength: 30
          example: M8X 2X2
        country:
          type:
          - string
          - 'null'
          description: "Provides the two letter country code according the ISO 3166-1 alpha-2 standard. \nFor a complete list of country codes, visit: https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2.\n"
          minLength: 2
          maxLength: 2
          example: CA
          format: iso-3166
      example:
        unitNumber: 123A
        streetNumber: '3300'
        streetName: Bloor Street West
        city: Toronto
        province: 'ON'
        postalCode: M8X 2X2
        country: CA
