          maxItems: 100
          items:
            $ref: '#/components/schemas/signingOfficer'
    merchantDetails:
      type: object
      description: An object that contains key information about the merchant associated.
      required:
      - contactInformation
      - merchantInformation
      - locationAddress
      properties:
        contactInformation:
          $ref: '#/components/schemas/contactInformation'
        merchantInformation:
          $ref: '#/components/schemas/merchantInformation'
        locationAddress:
          $ref: '#/components/schemas/address'
        marketSegment:
          $ref: '#/components/schemas/marketSegment'
    masterCardTransactionVolume:
      type: integer
      description: A numeric value representing the total transaction volume generated through MasterCard payments.
      format: int32
    businessCategory:
      type:
      - string
      - 'null'
      description: The category of the business.
      maxLength: 255
      example: RESTAURANTS
      enum:
      - AIRLINES
      - AMUSEMENT_AND_ENTERTAINMENT
      - AUTOMOBILE_VEHICLE_RENTAL
      - AUTOMOBILES_AND_VEHICLES
      - BUSINESS_SERVICES
      - CONTRACTED_SERVICES
      - GOVERNMENT_SERVICES
      - HOTELS_AND_MOTELS
      - MAIL_ORDER_TELEPHONE_ORDER_PROVIDERS
      - PERSONAL_SERVICE_PROVIDERS
      - PROFESSIONAL_SERVICES_AND_MEMBERSHIPS
      - REPAIR_SERVICES
      - RESTAURANTS
      - RETAILER
      - RETAILERS
      - SERVICE_PROVIDERS
      - TRANSPORTATION
      - UTILITIES
      - WHOLESALERS_MANUFACTURERS
    softwareVendors:
      type: array
      description: A list of software vendors associated with the device.
      items:
        type: string
    next:
      description: Pagination link pointing to the next page.
      type:
      - string
      - 'null'
      format: uri-reference
    discoverTransactionVolume:
      type: integer
      description: A numeric value representing the total transaction volume generated through Discover payments.
      format: int32
      example: 1000
    idempotencyKey:
      type: string
      description: "A Unique Identifier that is required for handling idempotent requests. \n\nNote: Moneris encourages the use of UUID Version 4 in APIs as an idempotency key.\"    \n"
      minLength: 1
      maxLength: 36
      example: 6q5w4e7r8t9y
    yearsOfOwnership:
      type: integer
      description: An integer representing the number of years the merchant has been in ownership.
      format: int32
    supplyName:
      type: string
      description: Indicates the name of the good available for fulfillment or distribution.
      maxLength: 100
      example: 2-PLY Sales Draft Slips (25)
    apiVersion:
      description: 'The endpoint''s API Version.  Must be provided through headers.

        '
      type: string
      example: '2025-08-14'
      default: '2025-08-14'
    merchantType:
      type:
      - string
      - 'null'
      description: The category of the merchant's business.
      enum:
      - NATIONAL
      - INDEPENDENT_BUSINESS
    cardReaderName:
      type:
      - string
      - 'null'
      description: The name of the card reader associated with the device.
    currency:
      type: string
      description: "Provides the three letter currency code according the ISO 4217 standard. \n\nFor a complete list of currency codes, visit: https://en.wikipedia.org/wiki/ISO_4217\n"
      minLength: 3
      maxLength: 4
      example: CAD
      format: iso-4217
    directSellingPercentage:
      description: The percentage of transactions processed through direct selling.
      type: number
      format: decimal
      minimum: 0
      maximum: 100
      example: 90.5
    riskLevel:
      type:
      - string
      - 'null'
      description: The risk level associated with the business.
      enum:
      - LOW
      - MEDIUM
      - HIGH
      example: LOW
    self:
      description: Pagination link pointing to the current page.
      type:
      - string
      - 'null'
      format: uri-reference
    merchantCategoryCode:
      type: string
      description: A four-digit code that classifies the type of business or service provided by the merchant, based on standard industry categories.
      minLength: 4
      maxLength: 4
      example: '0742'
    supply:
      type: object
      description: An object containing all details related to a supply.
      required:
      - supplyName
      - unitPrice
      properties:
        supplyName:
          $ref: '#/components/schemas/supplyName'
        unitPrice:
          $ref: '#/components/schemas/money'
        quantity:
          $ref: '#/components/schemas/quantity'
    averageTicketSize:
      type: integer
      description: A numeric value representing the average transaction amount for the business.
      format: int32
    phoneNumber:
      type: string
      description: Phone number.
      pattern: ^\+[1-9]\d{1,14}$
      minLength: 3
      maxLength: 16
      example: '+18663197450'
    businessUrl:
      type:
      - string
      - 'null'
      description: The official website URL of the business.
      format: uri
      maxLength: 255
      example: www.abc.com
    offeredProductsAndServicesDescription:
      type:
      - string
      - 'null'
      description: A description of type of products and services offered by the business.
      maxLength: 255
      example: food
    isSeasonalMerchant:
      type: boolean
      description: A boolean value indicating whether the business operates seasonally.
    merchantRiskRate:
      type: string
      description: A score indicating the level of risk associated with the merchant's transactions.
      maxLength: 60
      example: A+
      enum:
      - A
      - A_PLUS
      - B_HIGH
      - B_LOW
      - B_LOW_PLUS
      - B_MID
      - C
      - C_HIGH
      - C_HIGH_PLUS
      - C_LOW
      - C_LOW_PLUS
      - C_MID
      - C_MID_PLUS
      - C_PLUS
      - D
      - D_HIGH
      - D_LOW
      - D_MID
      - E
      - E_MINUS
      - F
    last:
      description: Pagination link pointing to the last page.
      type:
      - string
      - 'null'
      format: uri-reference
    quantity:
      type: integer
      description: Specifies the amount of goods currently available for a particular product.
      format: int32
      minimum: 1
      maximum: 100
      example: 1
    previous:
      description: Pagination link pointing to the previous page.
      type:
      - string
      - 'null'
      format: uri-reference
    merchantPayload:
      type: object
      description: An object containing the merchant payload details.
      required:
      - bankingDetails
      - businessDetails
      - merchantDetails
      - businessActivity
      - securityDetails
      properties:
        chainId:
          $ref: '#/components/schemas/chainId'
        bankingDetails:
          $ref: '#/components/schemas/bankingDetails'
        pointOfSaleOptions:
          type:
          - object
          - 'null'
          description: An object containing details about the point of sale options available for processing transactions.
          required:
          - settlementOption
          properties:
            settlementOption:
              $ref: '#/components/schemas/settlementOption'
            settlementTime:
              $ref: '#/components/schemas/settlementTime'
            debitPerTransactionRefundLimit:
              type:
              - object
              - 'null'
              description: "Monetary amount. \nNote: The value must be in cents. Therefore $10.59 must be sent as 1059.\n"
              properties:
                amount:
                  $ref: '#/components/schemas/amount'
                currency:
                  $ref: '#/components/schemas/currency'
              required:
              - amount
              - currency
              example:
                amount: 16000
                currency: CAD
            dailyRefundLimit:
              type:
              - object
              - 'null'
              description: "Monetary amount. \nNote: The value must be in cents. Therefore $10.59 must be sent as 1059.\n"
              properties:
                amount:
                  $ref: '#/components/schemas/amount'
                currency:
                  $ref: '#/components/schemas/currency'
              required:
              - amount
              - currency
              example:
                amount: 16000
                currency: CAD
            dailyCancellationLimit:
              type:
              - object
              - 'null'
              description: "Monetary amount. \nNote: The value must be in cents. Therefore $10.59 must be sent as 1059.\n"
              properties:
                amount:
                  $ref: '#/components/schemas/amount'
                currency:
                  $ref: '#/components/schemas/currency'
              required:
              - amount
              - currency
              example:
                amount: 16000
                currency: CAD
        businessDetails:
          $ref: '#/components/schemas/businessDetails'
        merchantDetails:
          $ref: '#/components/schemas/merchantDetails'
        businessActivity:
          $ref: '#/components/schemas/businessActivity'
        securityDetails:
          $ref: '#/components/schemas/securityDetails'
        riskDetails:
          type:
          - object
          - 'null'
          description: An object containing information related to the risk assessment of a transaction or account.
          required:
          - merchantRiskRate
          properties:
            merchantRiskRate:
              $ref: '#/components/schemas/merchantRiskRate'
    merchantId:
      type: string
      description: "Thirteen character long identification provided to merchants by Moneris. \n"
      minLength: 13
      maxLength: 13
      example: 0123456789101
    transitNumber:
      type:
      - string
      - 'null'
      description: Attribute representing the five-digit branch number of a financial institution.
      maxLength: 10
    carriers:
      type: array
      description: A list of carrier options available for the device.
      items:
        type: string
      maxItems: 10
    bankingDetails:
      type: object
      description: An object that contains the necessary banking information related to the account or transaction.
      required:
      - creditDepositAccount
      properties:
        creditDepositAccount:
          $ref: '#/components/schemas/bank'
        additionalBankingAccounts:
          type: array
          description: A list of additional banking accounts associated with the merchant.
          items:
            $ref: '#/components/schemas/additionalBankingAccount'
          maxItems: 10
    chainId:
      type:
      - string
      - 'null'
      description: A unique identifier assigned to a specific organizational chain.
      minLength: 13
      maxLength: 13
      example: '0030400001622'
    businessActivity:
      type: object
      description: An object containing all details about the business activity.
      required:
      - dropShipping
      properties:
        dropShipping:
          $ref: '#/components/schemas/dropShipping'
    additionalBankingAccount:
      type: object
      description: An object that contains additional banking account information.
      allOf:
      - $ref: '#/components/schemas/bank'
      - type: object
        required:
        - accountType
        properties:
          accountType:
            $ref: '#/components/schemas/addionalBankingAccountType'
    amount:
      type: integer
      format: int32
      minimum: 0
      maximum: 999999999
      example: 10000
      description: Amount
    legalEntity:
      type: object
      title: Legal Entity
      description: An object containing all details about the legal entity of the business.
      required:
      - businessType
      properties:
        businessType:
          $ref: '#/components/schemas/businessType'
  responses:
    forbidden:
      description: Forbidden. The user does not have permission to access the requested resource.
      headers:
        Api-Version:
          $ref: '#/components/headers/apiVersion'
        X-Correlation-Id:
          $ref: '#/components/headers/correlationId'
        Sunset:
          $ref: '#/components/headers/sunset'
        X-RateLimit-Limit:
          $ref: '#/components/headers/rateLimitCount'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/rateLimitRemaining'
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer, error="insufficient_scope"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            type: https://developer.moneris.com/en/More/Testing/Response%20Codes
            title: FORBIDDEN_REQUEST
            status: 403
            detail: null
            instance: null
            category: UNAUTHORIZED_ERROR
            errors: []
    tooManyRequests:
      description: Too Many Requests
      headers:
        Api-Version:
          $ref: '#/components/headers/apiVersion'
        X-Correlation-Id:
          $ref: '#/components/headers/correlationId'
        Sunset:
          $ref: '#/components/headers/sunset'
        X-RateLimit-Limit:
          $ref: '#/components/headers/rateLimitCount'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/rateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/rateLimitReset'
        Retry-After:
          $ref: '#/components/headers/rateLimitReset'
    conflict:
      description: Request could not be completed due to a conflict with resource state or existing idempotency key.
      headers:
        Api-Version:
          $ref: '#/components/headers/apiVersion'
        X-Correlation-Id:
          $ref: '#/components/headers/correlationId'
        Sunset:
          $ref: '#/components/headers/sunset'
        X-RateLimit-Limit:
          $ref: '#/components/headers/rateLimitCount'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/rateLimitRemaining'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/error'
          examples:
            idempotency_error:
              $ref: '#/components/examples/IdempotencyRequestErrorResponse'
    unauthorized:
      description: Not authorized. The user does not have a valid API Key or Access Token.
      headers:
        Api-Version:
          $ref: '#/components/headers/apiVersion'
        X-Correlation-Id:
          $ref: '#/components/headers/correlationId'
        Sunset:
          $ref: '#/components/headers/sunset'
        X-RateLimit-Limit:
          $ref: '#/components/headers/rateLimitCount'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/rateLimitRemaining'
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer, error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            type: https://developer.moneris.com/en/More/Testing/Response%20Codes
            title: UNAUTHORIZED_REQUEST
            status: 401
            detail: null
            instance: null
            category: UNAUTHORIZED_ERROR
