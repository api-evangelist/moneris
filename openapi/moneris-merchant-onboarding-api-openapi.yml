components:
  schemas:
    signingOfficer:
      type: object
      description: An object containing all details about the signing officer of the business.
      required:
      - creditReportAllowed
      - firstName
      - lastName
      - address
      - dateOfBirth
      - ownershipPercentage
      - title
      properties:
        signingOfficerIdentifier:
          description: A unique identifier for the signing officer.
          type: integer
          format: int64
        creditReportAllowed:
          type: boolean
          description: A boolean value indicating whether the business has authorized the review of its credit report.
        firstName:
          description: The first name of the signing officer.
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 30
          example: John
        lastName:
          description: The last name of the signing officer.
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 30
          example: Doe
        address:
          $ref: '#/components/schemas/address'
        dateOfBirth:
          description: The date of birth of the signing officer.
          type: string
          format: date
          example: '2019-07-30'
        ownershipPercentage:
          description: A numeric value representing the percentage of ownership held by an individual in the business.
          type: number
          format: decimal
          minimum: 0
          maximum: 100
          example: 90.5
        title:
          description: The official position of the signing officer within the business.
          type: string
          maxLength: 60
          enum:
          - OWNER
          - PRESIDENT
          - VICE_PRESIDENT
          - SECRETARY
          - TREASURER
          - DIRECTOR
          - OTHER
        merchantRiskRate:
          type:
          - string
          - 'null'
          description: A score indicating the level of risk associated with the merchant's transactions.
          maxLength: 60
          example: A+
          enum:
          - A
          - A_PLUS
          - B_HIGH
          - B_LOW
          - B_LOW_PLUS
          - B_MID
          - C
          - C_HIGH
          - C_HIGH_PLUS
          - C_LOW
          - C_LOW_PLUS
          - C_MID
          - C_MID_PLUS
          - C_PLUS
          - D
          - D_HIGH
          - D_LOW
          - D_MID
          - E
          - E_MINUS
          - F
    merchantSupplies:
      description: An object containing a list of supplies associated with the merchant.
      type: object
      properties:
        data:
          type: array
          description: A list of supply items associated with the resource
          items:
            $ref: '#/components/schemas/merchantSupply'
        self:
          $ref: '#/components/schemas/self'
        first:
          $ref: '#/components/schemas/first'
        last:
          $ref: '#/components/schemas/last'
        next:
          $ref: '#/components/schemas/next'
        previous:
          $ref: '#/components/schemas/previous'
    businessType:
      type: string
      description: The category of the business.
      enum:
      - SOLE_PROPRIETOR
      - LIMITED_PARTNERSHIP
      - PARTNERSHIP
      - NON_PROFIT
      - NON_FOR_PROFIT
      - PRIVATE_CORPORATION
      - PUBLIC_CORPORATION
      - GOVERNMENT
    deviceName:
      type:
      - string
      - 'null'
      description: The name of the device.
    monthsOfOwnership:
      type: integer
      description: An integer representing the number of months the merchant has been in ownership.
      format: int32
    creditTransactionVolume:
      type: integer
      description: A numeric value representing the total transaction volume generated through credit-based payments.
      format: int32
    email:
      type: string
      format: email
      description: 'Contains the customer''s email address.


        For standard email protocols, visit: https://www.rfc-editor.org/rfc/rfc5322

        '
      minLength: 1
      maxLength: 320
      example: moneris@moneris.com
    merchantInformation:
      type: object
      description: An object containing all information about the merchant.
      required:
      - language
      - legalName
      - operatingAsName
      - cardholderName
      - yearsOfOwnership
      - monthsOfOwnership
      - customerServicePhoneNumber
      - email
      properties:
        language:
          enum:
          - en
          - fr
          description: The preferred language of the merchant.
          type: string
          format: iso-639
          minLength: 2
          maxLength: 2
          example: en
        legalName:
          $ref: '#/components/schemas/legalName'
        operatingAsName:
          $ref: '#/components/schemas/operatingAsName'
        cardholderName:
          description: The name of the person to whom the credit or debit card is issued.
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 60
          example: John Doe
        yearsOfOwnership:
          $ref: '#/components/schemas/yearsOfOwnership'
        monthsOfOwnership:
          $ref: '#/components/schemas/monthsOfOwnership'
        customerServicePhoneNumber:
          $ref: '#/components/schemas/phoneNumber'
        email:
          $ref: '#/components/schemas/email'
        merchantType:
          $ref: '#/components/schemas/merchantType'
    interacTransactionVolume:
      type: integer
      description: A numeric value representing the total transaction volume generated through Interac payments.
      format: int32
      example: 1000
    institutionNumber:
      type: string
      description: The name or identifier of the financial institution.
      maxLength: 5
      example: 809
      pattern: ^\d{5}
    addionalBankingAccountType:
      type: string
      description: The type of the additional banking account.
      enum:
      - POS_BILLING_ACCOUNT
      - CHARGEBACK_ACCOUNT
      - DEBIT_DEPOSIT_ACCOUNT
    bank:
      type: object
      description: An object that contains information about the bank associated with the account or transaction.
      required:
      - currency
      - institutionNumber
      - transitNumber
      - accountNumber
      properties:
        currency:
          $ref: '#/components/schemas/currency'
        institutionNumber:
          $ref: '#/components/schemas/institutionNumber'
        transitNumber:
          $ref: '#/components/schemas/transitNumber'
        accountNumber:
          $ref: '#/components/schemas/accountNumber'
    lastName:
      type:
      - string
      - 'null'
      description: Last name.
      minLength: 1
      maxLength: 30
      example: Doe
