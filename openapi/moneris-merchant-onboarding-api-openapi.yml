    serviceDeliverToUSAvailable:
      type: boolean
      description: A boolean value indicating whether the business is available for delivery to US.
    first:
      description: Pagination link pointing to the first page.
      type:
      - string
      - 'null'
      format: uri-reference
    firstName:
      type:
      - string
      - 'null'
      description: First name.
      minLength: 1
      maxLength: 30
      example: John
    businessDetails:
      type: object
      description: An object containing key information about the business associated with the account or transaction.
      required:
      - merchantCategoryCode
      - isSeasonalMerchant
      - directSellingPercentage
      - motoTransactionPercentage
      - ecommerceTransactionPercentage
      properties:
        merchantCategoryCode:
          $ref: '#/components/schemas/merchantCategoryCode'
        averageTicketSize:
          $ref: '#/components/schemas/averageTicketSize'
        isSeasonalMerchant:
          $ref: '#/components/schemas/isSeasonalMerchant'
        maximumTransactionVolume:
          $ref: '#/components/schemas/maximumTransactionVolume'
        directSellingPercentage:
          $ref: '#/components/schemas/directSellingPercentage'
        motoTransactionPercentage:
          $ref: '#/components/schemas/motoTransactionPercentage'
        ecommerceTransactionPercentage:
          $ref: '#/components/schemas/ecommerceTransactionPercentage'
        businessUrl:
          $ref: '#/components/schemas/businessUrl'
        serviceProvider:
          $ref: '#/components/schemas/serviceProvider'
        serviceDeliverToCanadaAvailable:
          $ref: '#/components/schemas/serviceDeliverToCanadaAvailable'
        serviceDeliverToUSAvailable:
          $ref: '#/components/schemas/serviceDeliverToUSAvailable'
        creditTransactionVolume:
          $ref: '#/components/schemas/creditTransactionVolume'
        masterCardTransactionVolume:
          $ref: '#/components/schemas/masterCardTransactionVolume'
        visaTransactionVolume:
          $ref: '#/components/schemas/visaTransactionVolume'
        visaDebitTransactionVolume:
          $ref: '#/components/schemas/visaDebitTransactionVolume'
        amexTransactionVolume:
          $ref: '#/components/schemas/amexTransactionVolume'
        interacTransactionVolume:
          $ref: '#/components/schemas/interacTransactionVolume'
        masterCardDebitTransactionVolume:
          $ref: '#/components/schemas/masterCardDebitTransactionVolume'
        unionPayTransactionVolume:
          $ref: '#/components/schemas/unionPayTransactionVolume'
        discoverTransactionVolume:
          $ref: '#/components/schemas/discoverTransactionVolume'
        category:
          $ref: '#/components/schemas/businessCategory'
        subCategory:
          $ref: '#/components/schemas/businessSubCategory'
        offeredProductsAndServicesDescription:
          $ref: '#/components/schemas/offeredProductsAndServicesDescription'
        riskLevel:
          $ref: '#/components/schemas/riskLevel'
    serviceCode:
      type:
      - string
      - 'null'
      description: The service code associated with the device.
    operatingAsName:
      type: string
      description: The trade name under which the merchant operates.
      maxLength: 30
      example: Pizza 2 Go
    motoTransactionPercentage:
      description: The percentage of transactions processed through mail order / telephone order.
      type: number
      format: decimal
      minimum: 0
      maximum: 100
      example: 90.5
    amexTransactionVolume:
      type: integer
      description: A numeric value representing the total transaction volume generated through American Express payments.
      format: int32
      example: 1000
    serviceProvider:
      type:
      - string
      - 'null'
      description: The name or identifier of the service provider associated to the business.
      maxLength: 255
      example: moneris.com
    parameterError:
      title: Parameter error
      description: Request property or header related error.
      type: object
      properties:
        parameterName:
          type: string
          description: Property or header name. Can contain nested path separated by '.'
          example: address.postalCode
        parameterValue:
          type:
          - string
          - 'null'
          description: Property or header value string representation.
          example: MAP3J8
        reasonCode:
          type: string
          description: Reason that triggered the error.
          enum:
          - INVALID_FORMAT
          - REQUIRED_FIELD
          - INVALID_VALUE
          example: INVALID_FORMAT
        errorMessage:
          type:
          - string
          - 'null'
          description: Human readable description of the error.
          example: String 'MAP3J8' does not match the postal code pattern.
      required:
      - parameterName
      - reasonCode
    serviceDeliverToCanadaAvailable:
      type: boolean
      description: A boolean value indicating whether the business is available for delivery to Canada.
    error:
      description: Error response details.
      properties:
        type:
          description: 'A URI reference that identifies the problem type.  Ideally it should be a stable URL to the documentation of the details about this type of error but it also can be a URN.  If nothing can be provided, a "about:blank" value is returned.

            '
          type: string
          format: uri
          example: https://api-developer.moneris.com/responsehandling
        title:
          description: 'A short, human-readable summary of the problem type.   It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization

            '
          type:
          - string
          - 'null'
          example: INSUFFICIENT_FUNDS
        status:
          description: 'it conveys the HTTP status code used for the convenience of the consumer.

            '
          type:
          - integer
          - 'null'
          format: int32
          minimum: 100
          maximum: 505
        detail:
          description: 'A human-readable message providing more details about the error. For card errors, these messages can be shown to your users.

            '
          type:
          - string
          - 'null'
          example: Funds are insufficient to execute the operation.
        instance:
          description: 'A URI reference that identifies the specific occurrence of the problem. Typically, this resolves to a resource that might include more details about the problem.

            '
          type:
          - string
          - 'null'
          example: /payments/12f3e0a8-1d68-2b86-dd30-4ca51bb66e10
          format: uri-reference
        category:
          description: "The type of error returned. \n - `API_ERROR`: This occurs due to an intermittent issue.  \n - `IDEMPOTENCY_ERROR`: The idempotency key has already been used.\n - `INVALID_REQUEST_ERROR`: The data provided in the request is invalid.\n - `DECLINED_ERROR`: Transaction was declined by the issuer.\n - `UNAUTHORIZED_ERROR`: Caller not authenticated, or not allowed to execute the current operation.\n - `INTERNAL_SERVER_ERROR`: An internal issue with our servers has occured.\n"
          enum:
          - API_ERROR
          - IDEMPOTENCY_ERROR
          - INVALID_REQUEST_ERROR
          - DECLINED_ERROR
          - UNAUTHORIZED_ERROR
          - INTERNAL_SERVER_ERROR
          - null
          type:
          - string
          - 'null'
          example: DECLINED_ERROR
        errors:
          type: array
          description: List of validation errors when error category is INVALID_REQUEST_ERROR.
          items:
            type: object
            $ref: '#/components/schemas/parameterError'
          example:
          - parameterName: address.postalCode
            parameterValue: MAP3J8
            errorMessage: address.Postal code does not match regular expression
            reasonCode: INVALID_FORMAT
      title: API Error
      type: object
      required:
      - type
    maximumTransactionVolume:
      type: integer
      description: A numeric value that represents the highest expected transaction volume.
      format: int32
    ecommerceTransactionPercentage:
      description: The percentage of transactions processed through e-commerce.
      type: number
      format: decimal
      minimum: 0
      maximum: 100
      example: 90.5
